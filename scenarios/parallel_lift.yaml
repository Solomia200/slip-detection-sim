description: "Двопалий гріпер з XML-файлу: взяти циліндр і підняти"

hand:
  type: xml
  file: hands/parallel_gripper/parallel_gripper.xml
  palm_body: palm
  grip_actuators: [left, right]
  lift_actuator: lift
  pads:
    - {body: finger_left, euler_deg: [0, 0, -90]}
    - {body: finger_right, euler_deg: [0, 0, 90]}

phases:
  - {do: close, force_n: 6}
  - {do: hold, duration_s: 0.3}
  - {do: lift, height_mm: 50, duration_s: 1.0}
  - {do: hold, duration_s: 1.0}
