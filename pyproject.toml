[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slipsim"
version = "0.1.0"
description = "MuJoCo workbench for shear-force and slip-detection research with tactile sensors"
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.10.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pydantic>=2.6,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
slipsim = "slipsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
